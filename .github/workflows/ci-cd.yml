name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # needed for the OIDC login to AWS

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: secure-cicd-app
  ECS_CLUSTER: secure-cicd-cluster
  ECS_SERVICE: secure-cicd-service
  ECS_TASK_FAMILY: secure-cicd-task
  CONTAINER_NAME: app

jobs:
  build-scan-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so Gitleaks can scan past commits

      - name: Scan for secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Report only. The demo security group is open on purpose, so this does not fail the build.
      - name: Scan Dockerfile and Terraform config (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Build image
        run: |
          docker build --pull\
            --build-arg GIT_SHA=${{ github.sha }} \
            -t "$ECR_REPOSITORY:${{ github.sha }}" \
            ./app

      # This step fails the build if the image has fixable HIGH or CRITICAL vulnerabilities
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Everything below runs only on pushes to main, never on pull requests
      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:${{ github.sha }}"
          docker tag "$ECR_REPOSITORY:${{ github.sha }}" "$IMAGE"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Get current task definition
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Put the new image into the task definition
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.push.outputs.image }}

      - name: Deploy to Amazon ECS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          desired-count: 1
          wait-for-service-stability: true
